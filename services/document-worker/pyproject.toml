[project]
name = "resumegpt-document-worker"
version = "0.1.0"
description = "Isolated document extraction for ResumeGPT"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10,<13",
  "pypdfium2==5.13.0"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
