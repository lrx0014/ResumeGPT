name: Docker Publish

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag from trigger
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="latest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: .
            dockerfile: Dockerfile
          - name: document-worker
            context: services/document-worker
            dockerfile: services/document-worker/Dockerfile
          - name: web-worker
            context: services/web-worker
            dockerfile: services/web-worker/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
        platform:
          # Native builders per architecture instead of QEMU emulation, so
          # slow steps (Go builds, apt/texlive installs, npm builds) run at
          # full speed on hardware that actually matches the target arch.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    # Secrets/variables stored on a GitHub Environment are only visible to a
    # job that declares that environment. Create this environment (Settings
    # -> Environments -> New environment -> "devops") and add
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN there. Plain repository secrets
    # keep working too -- this declaration doesn't hide those.
    environment: devops
    env:
      # Docker Hub account/org that owns the image repositories, e.g. "resumegpt".
      # Falls back to the login username when no separate namespace is configured.
      IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} (${{ matrix.platform.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/resumegpt-${{ matrix.image.name }}:${{ needs.resolve-tag.outputs.tag }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

  publish-manifest:
    name: Publish ${{ matrix.image }} manifest
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, document-worker, web-worker, web]
    environment: devops
    env:
      IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          image="${{ env.IMAGE_NAMESPACE }}/resumegpt-${{ matrix.image }}"
          tag="${{ needs.resolve-tag.outputs.tag }}"
          docker buildx imagetools create \
            -t "$image:$tag" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"
